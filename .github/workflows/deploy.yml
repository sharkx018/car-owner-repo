name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build index.html from repo variables
        env:
          CAR_NUMBER: ${{ vars.CAR_NUMBER }}
          CAR_MODEL: ${{ vars.CAR_MODEL }}
          OWNER_NAMES: ${{ vars.OWNER_NAMES }}
          OWNER_PHONES: ${{ vars.OWNER_PHONES }}
        run: node build.js

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp car_logo.png _site/car_logo.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
