  }
  :root{
    --red:#E2273D;
    --ink:#1A1A1A;
    --gold:#FFC93C;
    --cream:#FFF9EC;
  }
  *{
    box-sizing:border-box;
  }
  html,body{
    margin:0;
    padding:0;
    background:#dcdcda;
    font-family:'Sora',sans-serif;
  }
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:264px;
    border-radius:22px;
    overflow:hidden;
    background:var(--gold);
    box-shadow:0 20px 40px rgba(0,0,0,0.18);
  }
  .qr-panel{
    padding:22px 22px 18px;
    display:flex;
    justify-content:center;
  }
  .qr-frame{
    background:var(--cream);
    border-radius:14px;
    padding:12px;
    line-height:0;
  }
  .qr-frame img{
    width:190px;
    height:190px;
    display:block;
  }
  .band{
    background:var(--red);
    padding:18px 18px 8px;
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .phone-badge{
    flex:none;
    width:34px;
    height:34px;
    border-radius:10px;
    background:linear-gradient(160deg,#5FD068 0%,#229A47 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
    align-self:center;
  }
  h1{
    margin:0;
    font-family:'Luckiest Guy',cursive;
    font-size:27px;
    font-weight:400;
    letter-spacing:0.5px;
    color:#fff;
    text-transform:uppercase;
    white-space:nowrap;
    line-height:1;
    -webkit-text-stroke:2px #7A1020;
    paint-order:stroke fill;
    text-shadow:0 3px 0 rgba(0,0,0,0.15);
    transform:translateY(3px);
    align-self:center;
  }
  .logo-footer{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:2px 20px 16px;
    background:var(--red);
  }
  .logo-footer img{
    width:90px;
    height:auto;
    display:block;
    object-fit:contain;
  }
  .credit{
    padding:8px 0 14px;
    font-size:0.7rem;
    color:var(--red);
    opacity:0.7;
    text-align:center;
  }
</style>
</head>
