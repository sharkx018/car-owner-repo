<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{CAR_NUMBER}} — Owner Contact</title>
<style>
  :root {
    --bg-a: #eef2ff;
    --bg-b: #f5f3ff;
    --bg-c: #fdf2f8;
    --card-bg: #ffffff;
    --text: #1a1d29;
    --muted: #6b7280;
    --border: #ecebf3;
    --plate-bg: linear-gradient(180deg, #ffffff 0%, #f4f4f6 100%);
    --plate-border: #1a1d29;
    --plate-stripe: #1e3a8a;
    --plate-stripe-text: #ffffff;
    --call-bg: linear-gradient(135deg, #22c55e, #16a34a);
    --whatsapp-bg: linear-gradient(135deg, #34d399, #059669);
    --shadow: 0 20px 45px -15px rgba(30, 41, 82, 0.25);
    --shadow-soft: 0 2px 10px rgba(30, 41, 82, 0.06);
    --avatar-1: linear-gradient(135deg, #6366f1, #8b5cf6);
    --avatar-2: linear-gradient(135deg, #ec4899, #f97316);
    --avatar-3: linear-gradient(135deg, #06b6d4, #3b82f6);
    --avatar-4: linear-gradient(135deg, #f59e0b, #ef4444);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-a: #0b0e17;
      --bg-b: #12101f;
      --bg-c: #170f1a;
      --card-bg: #171a26;
      --text: #f4f5f8;
      --muted: #9aa1b2;
      --border: #262a3a;
      --plate-bg: linear-gradient(180deg, #f4f4f6 0%, #e5e5e8 100%);
      --plate-border: #0b0e17;
      --shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.55);
      --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 15% 10%, var(--bg-a), transparent 55%),
                radial-gradient(circle at 85% 15%, var(--bg-c), transparent 50%),
                var(--bg-b);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 32px 26px 26px;
    text-align: center;
    animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }

  .plate {
    display: block;
    background: var(--plate-bg);
    color: #16181f;
    border: 3px solid var(--plate-border);
    border-radius: 10px;
    overflow: hidden;
    margin: 0 auto 22px;
    max-width: 300px;
    box-shadow: var(--shadow-soft);
  }

  .plate-band {
    background: var(--plate-stripe);
    color: var(--plate-stripe-text);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 4px 0;
  }

  .plate-number {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    font-family: "Courier New", monospace;
    padding: 10px 18px 12px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0 0 24px;
    font-weight: 500;
  }

  .owners {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .owner {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    background: color-mix(in srgb, var(--card-bg) 96%, var(--text) 4%);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .owner:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
  }

  .avatar {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
  }

  .owner-info { min-width: 0; flex: 1; }

  .owner-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
    font-weight: 600;
  }

  .owner-name {
    font-weight: 700;
    font-size: 1.02rem;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .owner-phone {
    color: var(--muted);
    font-size: 0.86rem;
  }

  .owner-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.1rem;
    color: #fff;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.9); }

  .btn-call { background: var(--call-bg); }
  .btn-whatsapp { background: var(--whatsapp-bg); }

  .footer-note {
    margin-top: 22px;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">🚗 Vehicle Contact Card</span>
    <div class="plate">
      <div class="plate-band">INDIA</div>
      <div class="plate-number">{{CAR_NUMBER}}</div>
    </div>
    <p class="subtitle">Scan or tap to reach the owner directly</p>

    <div class="owners">
      {{OWNERS}}
    </div>

    <div class="footer-note">🔒 Private contact card — tap to call or message</div>
  </div>
</body>
</html>
