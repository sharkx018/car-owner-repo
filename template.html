<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{CAR_NUMBER}} — Owner Contact</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #1e3a8a;
    --accent-text: #ffffff;
    --plate-bg: #fbbf24;
    --plate-border: #1a1d23;
    --call-bg: #16a34a;
    --whatsapp-bg: #22c55e;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #f2f4f7;
      --muted: #9aa1ac;
      --border: #2a2e37;
      --accent: #3b5fc4;
      --accent-text: #ffffff;
      --plate-bg: #fbbf24;
      --plate-border: #0f1115;
      --shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px 24px 24px;
    text-align: center;
  }

  .plate {
    display: inline-block;
    background: var(--plate-bg);
    color: #1a1d23;
    border: 3px solid var(--plate-border);
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    font-family: "Courier New", monospace;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 10px 0 24px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .owner {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .owner:last-of-type { margin-bottom: 0; }

  .owner-info { min-width: 0; }

  .owner-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .owner-name {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .owner-phone {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .owner-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.2rem;
    color: var(--accent-text);
    transition: transform 0.15s ease;
  }

  .btn:active { transform: scale(0.92); }

  .btn-call { background: var(--call-bg); }
  .btn-whatsapp { background: var(--whatsapp-bg); }

  .footer-note {
    margin-top: 20px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="plate">{{CAR_NUMBER}}</div>
    <div class="subtitle">Vehicle Owner Contact</div>

    {{OWNERS}}

    <div class="footer-note">Tap a button to call or message the owner directly.</div>
  </div>
</body>
</html>
